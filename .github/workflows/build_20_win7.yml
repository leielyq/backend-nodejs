name: build nodejs v20 win7

on:
  workflow_dispatch:
    inputs:
      tag_date:
        description: 'tag date'
        required: true

env:
  VERSION: 20.19.2
  WIN7_SOURCE_REPO: https://github.com/vladimir-andreevich/node.js-windows-7
  WIN7_SOURCE_DIR: v20/node-v20.19.2
  NODE_MODULE_VERSION: 115
  OUTPUT_DIR: nodejs_20_win7

jobs:
  build_windows:
    name: Windows-Win7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select latest MSVC toolset
        shell: pwsh
        run: .\node-script\ensure_msvc_toolset.ps1
      - name: Fetch win7-patched Node.js source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 "$WIN7_SOURCE_REPO" win7repo
          cd win7repo
          git sparse-checkout set "$WIN7_SOURCE_DIR"
          git -c core.autocrlf=false checkout
          cd ..
          mv "win7repo/$WIN7_SOURCE_DIR" node
          rm -rf win7repo
          # patches must stay LF so git apply matches the LF source tree
          sed -i 's/\r$//' "patchs/win_build_v${VERSION}.patch" "patchs/lib_uv_add_on_watcher_queue_updated_v${VERSION}.patch"
          ls node/vcbuild.bat
      - name: Run build script
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          call .\windows_trybuild_win7.cmd %VERSION%
      - name: Run upload script
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          call .\windows_64.cmd
      - name: Rename
        shell: bash
        run: mv puerts-node/nodejs puerts-node/${{ env.OUTPUT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: nodejs_bin_win7_x64
          path: puerts-node/**/*

  build_windows_32:
    name: Windows-Win7-32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select latest MSVC toolset
        shell: pwsh
        run: .\node-script\ensure_msvc_toolset.ps1
      - name: Fetch win7-patched Node.js source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 "$WIN7_SOURCE_REPO" win7repo
          cd win7repo
          git sparse-checkout set "$WIN7_SOURCE_DIR"
          git -c core.autocrlf=false checkout
          cd ..
          mv "win7repo/$WIN7_SOURCE_DIR" node
          rm -rf win7repo
          sed -i 's/\r$//' "patchs/win_build_v${VERSION}.patch" "patchs/lib_uv_add_on_watcher_queue_updated_v${VERSION}.patch"
          ls node/vcbuild.bat
      - name: Run build script
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          call .\windows_trybuild_win7.cmd %VERSION% x86
      - name: Run upload script
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          call .\windows_32.cmd
      - name: Rename
        shell: bash
        run: mv puerts-node/nodejs puerts-node/${{ env.OUTPUT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: nodejs_bin_win7_x86
          path: puerts-node/**/*

  publish:
    runs-on: ubuntu-latest
    needs: [build_windows, build_windows_32]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: nodejs_bin/
          merge-multiple: true
      - name: Create Release Asset
        run: |
          cd nodejs_bin/ && tar cvfz ../nodejs_bin_${{ env.VERSION }}_win7.tgz ${{ env.OUTPUT_DIR }} && cd -
      - name: Remove Existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: NodeJS_${{ env.VERSION }}_win7_${{ github.event.inputs.tag_date }}
        run: |
          set -euo pipefail
          echo "Preparing release tag ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Deleting existing release ${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag
          else
            echo "No existing release named ${RELEASE_TAG}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Deleting existing git tag ${RELEASE_TAG}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          else
            echo "No existing git tag named ${RELEASE_TAG}"
          fi
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: NodeJS_${{ env.VERSION }}_win7_${{ github.event.inputs.tag_date }}
          release_name: NodeJS_${{ env.VERSION }}_win7_${{ github.event.inputs.tag_date }}
          draft: false
          prerelease: false
      - name: Upload nodejs_bin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./nodejs_bin_${{ env.VERSION }}_win7.tgz
          asset_name: nodejs_bin_${{ env.VERSION }}_win7.tgz
          asset_content_type: application/tgz
